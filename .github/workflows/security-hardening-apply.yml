name: Apply pharmacy security hardening
on: push
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 scripts/apply_security_hardening.py
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Commit hardened source
        run: |
          rm -f scripts/apply_security_hardening.py .github/workflows/security-hardening-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: harden pharmacy authentication and order access" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
