name: Apply pharmacy security hardening

on:
  push:
    branches:
      - security-hardening-2026-08-18

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted security fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          # ---------- .env.example ----------
          env = read('.env.example')
          env = re.sub(r'^JWT_SECRET=.*$', 'JWT_SECRET=', env, flags=re.M)
          if 'ADMIN_PASSWORD=' not in env:
              env += '\n# Server-side admin password used only to initialize the admin account.\nADMIN_PASSWORD=\n'
          if 'PHARMACIST_PASSWORD=' not in env:
              env += '# Optional server-side pharmacist password. Leave empty to omit the seeded pharmacist account.\nPHARMACIST_PASSWORD=\n'
          write('.env.example', env.rstrip() + '\n')

          # ---------- rate limiter ----------
          write('server/rateLimiter.ts', '''import type { NextFunction, Request, Response } from 'express';

          interface RateLimitOptions {
            windowMs: number;
            max: number;
            key?: (req: Request) => string;
          }

          interface Bucket {
            count: number;
            resetAt: number;
          }

          // Best-effort per-function-instance limiter. It intentionally does not claim
          // to be globally distributed; Vercel Firewall/global rate limiting can be
          // layered on later without changing application behavior.
          export function createRateLimiter(options: RateLimitOptions) {
            const buckets = new Map<string, Bucket>();

            return (req: Request, res: Response, next: NextFunction) => {
              const now = Date.now();
              const key = options.key?.(req) || req.ip || req.socket.remoteAddress || 'unknown';
              const current = buckets.get(key);

              if (!current || current.resetAt <= now) {
                buckets.set(key, { count: 1, resetAt: now + options.windowMs });
                res.setHeader('X-RateLimit-Limit', options.max);
                return next();
              }

              if (current.count >= options.max) {
                const retryAfter = Math.max(1, Math.ceil((current.resetAt - now) / 1000));
                res.setHeader('Retry-After', retryAfter);
                return res.status(429).json({ error: 'Too many requests. Please try again later.' });
              }

              current.count += 1;
              res.setHeader('X-RateLimit-Limit', options.max);
              next();
            };
          }
          '''.replace('          ', ''))

          # ---------- server/db.ts ----------
          db = read('server/db.ts')
          db = db.replace(
              "const JWT_SECRET = process.env.JWT_SECRET || 'gods-favor-pharmacy-secure-secret-key-kitale-2026';",
              "const JWT_SECRET = process.env.JWT_SECRET;\nif (!JWT_SECRET || JWT_SECRET.length < 32) {\n  throw new Error('JWT_SECRET must be configured as a random server-side secret of at least 32 characters.');\n}"
          )
          db = re.sub(
              r"function getInitialDatabase\(\): DatabaseSchema \{.*?\n  return \{",
              '''function getInitialDatabase(): DatabaseSchema {
            const adminPassword = process.env.ADMIN_PASSWORD;
            if (!adminPassword || adminPassword.length < 12) {
              throw new Error('ADMIN_PASSWORD must be configured with at least 12 characters before the pharmacy database can initialize.');
            }
            const pharmacistPassword = process.env.PHARMACIST_PASSWORD;
            const now = new Date().toISOString();
            const initialUsers: UserRecord[] = [
              {
                id: 'usr-admin-01',
                fullName: 'Chief Pharmacist / Admin',
                phone: '07417758578',
                email: 'admin@godsfavorpharmacy.ke',
                address: 'Kijana Wamalwa Road, Kitale',
                role: 'admin',
                passwordHash: bcrypt.hashSync(adminPassword, 12),
                tokenVersion: 0,
                createdAt: now,
                updatedAt: now,
              },
              ...(pharmacistPassword
                ? [{
                    id: 'usr-pharm-01',
                    fullName: 'Clinical Pharmacist on Duty',
                    phone: '07417758578',
                    email: 'pharmacist@godsfavorpharmacy.ke',
                    address: 'Kitale Town',
                    role: 'pharmacist' as const,
                    passwordHash: bcrypt.hashSync(pharmacistPassword, 12),
                    tokenVersion: 0,
                    createdAt: now,
                    updatedAt: now,
                  }]
                : []),
            ];

            return {''',
              db,
              count=1,
              flags=re.S,
          )
          db = db.replace(
              "  users: UserRecord[];",
              "  users: UserRecord[];"
          )
          db = db.replace(
              "interface UserRecord extends User {\n  passwordHash: string;\n}",
              "interface UserRecord extends User {\n  passwordHash: string;\n  tokenVersion?: number;\n}"
          )
          db = db.replace(
              "      if (!dbInstance!.users) dbInstance!.users = [];",
              "      if (!dbInstance!.users) dbInstance!.users = [];\n      dbInstance!.users = dbInstance!.users.map((user) => ({ ...user, tokenVersion: user.tokenVersion ?? 0 }));"
          )
          db = db.replace(
              "      id: `usr-${Date.now()}-${Math.random().toString(36).substr(2, 6)}`,",
              "      id: `usr-${Date.now()}-${Math.random().toString(36).substr(2, 6)}`,"
          )
          # Add tokenVersion to newly registered users.
          db = db.replace(
              "    role: 'customer',\n    passwordHash,",
              "    role: 'customer',\n    passwordHash,\n    tokenVersion: 0,"
          )
          db = db.replace(
              '''export function generateToken(user: User): string {
            return jwt.sign(
              { id: user.id, email: user.email, role: user.role, fullName: user.fullName },
              JWT_SECRET,
              { expiresIn: '7d' }
            );
          }

          export function verifyToken(token: string): { id: string; email: string; role: string; fullName: string } | null {
            try {
              return jwt.verify(token, JWT_SECRET) as { id: string; email: string; role: string; fullName: string };
            } catch (err) {
              return null;
            }
          }''',
              '''export function generateToken(user: User, tokenVersion = 0): string {
            return jwt.sign(
              { id: user.id, email: user.email, role: user.role, fullName: user.fullName, tokenVersion },
              JWT_SECRET,
              { expiresIn: '7d' }
            );
          }

          export function verifyToken(token: string): { id: string; email: string; role: string; fullName: string; tokenVersion?: number } | null {
            try {
              const decoded = jwt.verify(token, JWT_SECRET) as { id: string; email: string; role: string; fullName: string; tokenVersion?: number };
              const db = loadDatabase();
              const user = db.users.find((candidate) => candidate.id === decoded.id);
              if (!user || (user.tokenVersion ?? 0) !== (decoded.tokenVersion ?? 0)) {
                return null;
              }
              return decoded;
            } catch (err) {
              return null;
            }
          }

          export function revokeUserTokens(userId: string): void {
            const db = loadDatabase();
            const user = db.users.find((candidate) => candidate.id === userId);
            if (!user) return;
            user.tokenVersion = (user.tokenVersion ?? 0) + 1;
            user.updatedAt = new Date().toISOString();
            saveDatabase();
          }'''
          )
          db = db.replace(
              "  const token = generateToken(safe);\n  return { user: safe, token };",
              "  const token = generateToken(safe, newUser.tokenVersion ?? 0);\n  return { user: safe, token };",
              1
          )
          db = db.replace(
              "  const token = generateToken(safe);\n  return { user: safe, token };",
              "  const token = generateToken(safe, user.tokenVersion ?? 0);\n  return { user: safe, token };",
              1
          )
          db = db.replace(
              "const orderNumber = `GFP-2026-${randomDigits}`;",
              "const orderNumber = `GFP-${new Date().getFullYear()}-${randomDigits}`;"
          )
          db = db.replace(
              "const prescriptionNumber = `RX-2026-${randomDigits}`;",
              "const prescriptionNumber = `RX-${new Date().getFullYear()}-${randomDigits}`;"
          )
          db = db.replace(
              "const appointmentNumber = `APT-2026-${randomDigits}`;",
              "const appointmentNumber = `APT-${new Date().getFullYear()}-${randomDigits}`;"
          )
          write('server/db.ts', db)

          # ---------- server.ts ----------
          server = read('server.ts')
          if "import { createRateLimiter } from './server/rateLimiter';" not in server:
              server = server.replace(
                  "import { UserRole } from './src/types';",
                  "import { UserRole } from './src/types';\nimport { createRateLimiter } from './server/rateLimiter';"
              )
          marker = "app.use(express.urlencoded({ extended: true, limit: '25mb' }));"
          rate_block = marker + '''

// Best-effort per-instance abuse protection. For globally distributed protection,
// configure Vercel Firewall/rate limiting separately; this middleware does not claim
// to provide a global counter across function instances.
app.use('/api/auth/login', createRateLimiter({ windowMs: 15 * 60 * 1000, max: 10 }));
app.use('/api/auth/register', createRateLimiter({ windowMs: 15 * 60 * 1000, max: 8 }));
app.use('/api/payments/submit', createRateLimiter({ windowMs: 10 * 60 * 1000, max: 10 }));
app.use('/api/contact', createRateLimiter({ windowMs: 10 * 60 * 1000, max: 10 }));
app.use('/api/ai/health-assistant', createRateLimiter({ windowMs: 5 * 60 * 1000, max: 20 }));
app.use('/api/orders/track', createRateLimiter({ windowMs: 10 * 60 * 1000, max: 20 }));'''
          if "app.use('/api/auth/login', createRateLimiter" not in server:
              server = server.replace(marker, rate_block)

          old_track = '''    res.json(order);
  } catch (err: any) {
    res.status(500).json({ error: err.message || 'Error tracking order' });
  }
});

app.get('/api/orders/:id', authenticateOptional, (req: AuthenticatedRequest, res: Response) => {
  try {
    const order = getOrderByNumberOrId(req.params.id);
    if (!order) {
      return res.status(404).json({ error: 'Order not found' });
    }
    // Allow if public lookup or owner or staff
    res.json(order);
  } catch (err: any) {
    res.status(500).json({ error: err.message || 'Error retrieving order' });
  }
});'''
          new_track = '''    // Public tracking intentionally returns only non-sensitive status information.
    res.json({
      id: order.id,
      orderNumber: order.orderNumber,
      status: order.status,
      paymentStatus: order.paymentStatus,
      fulfillmentMethod: order.fulfillmentMethod,
      total: order.total,
      createdAt: order.createdAt,
      updatedAt: order.updatedAt,
    });
  } catch (err: any) {
    res.status(500).json({ error: err.message || 'Error tracking order' });
  }
});

app.get('/api/orders/:id', authenticateOptional, (req: AuthenticatedRequest, res: Response) => {
  try {
    const order = getOrderByNumberOrId(req.params.id);
    if (!order) {
      return res.status(404).json({ error: 'Order not found' });
    }

    const isStaff = ['admin', 'pharmacist', 'staff', 'super_admin'].includes(req.user?.role || '');
    if (!req.user) {
      return res.status(401).json({ error: 'Authentication required to access order details.' });
    }
    if (!isStaff && order.customerId !== req.user.id) {
      return res.status(403).json({ error: 'Forbidden. You may only access your own orders.' });
    }

    res.json(order);
  } catch (err: any) {
    res.status(500).json({ error: err.message || 'Error retrieving order' });
  }
});'''
          if old_track not in server:
              raise SystemExit('Expected order tracking/IDOR block was not found; refusing a speculative edit.')
          server = server.replace(old_track, new_track, 1)

          old_payment = '''app.post('/api/payments/submit', (req: Request, res: Response) => {
  try {
    const { orderId, transactionReference, proofUrl } = req.body;
    if (!orderId || !transactionReference) {
      return res.status(400).json({ error: 'Order ID and transaction reference are required.' });
    }
    const order = submitOrderPayment(orderId, transactionReference, proofUrl);'''
          new_payment = '''app.post('/api/payments/submit', requireAuth, (req: AuthenticatedRequest, res: Response) => {
  try {
    const { orderId, transactionReference, proofUrl } = req.body;
    if (!orderId || !transactionReference) {
      return res.status(400).json({ error: 'Order ID and transaction reference are required.' });
    }
    const targetOrder = getOrderByNumberOrId(orderId);
    if (!targetOrder) {
      return res.status(404).json({ error: 'Order not found.' });
    }
    const isStaff = ['admin', 'pharmacist', 'staff', 'super_admin'].includes(req.user!.role);
    if (!isStaff && targetOrder.customerId !== req.user!.id) {
      return res.status(403).json({ error: 'Forbidden. You may only submit payment for your own order.' });
    }
    const order = submitOrderPayment(orderId, transactionReference, proofUrl);'''
          if old_payment not in server:
              raise SystemExit('Expected payment authorization block was not found; refusing a speculative edit.')
          server = server.replace(old_payment, new_payment, 1)

          auth_me = "app.get('/api/auth/me', requireAuth, (req: AuthenticatedRequest, res: Response) => {"
          logout_route = '''app.post('/api/auth/logout', requireAuth, (req: AuthenticatedRequest, res: Response) => {
  try {
    // Incrementing tokenVersion invalidates the current JWT immediately on the
    // function instance's current database state. The same JWT is also bounded
    // by its 7-day expiry and the rotated JWT_SECRET.
    revokeUserTokens(req.user!.id);
    res.json({ success: true, message: 'Logged out successfully.' });
  } catch (err: any) {
    res.status(500).json({ error: err.message || 'Logout failed' });
  }
});

'''
          if logout_route not in server:
              server = server.replace(auth_me, logout_route + auth_me, 1)
          server = server.replace(
              "  getUserById,\n} from './server/db';",
              "  getUserById,\n  revokeUserTokens,\n} from './server/db';"
          )
          write('server.ts', server)

          # ---------- frontend API logout ----------
          api = read('src/services/api.ts')
          login_marker = '''  async login(email: string, password: string): Promise<AuthResponse> {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    return handleResponse<AuthResponse>(res);
  },'''
          logout_method = login_marker + '''

  async logout(): Promise<{ success: boolean; message: string }> {
    const res = await fetch(`${API_BASE}/auth/logout`, {
      method: 'POST',
      headers: getAuthHeaders(),
    });
    return handleResponse<{ success: boolean; message: string }>(res);
  },'''
          if "async logout(): Promise<{ success: boolean; message: string }>" not in api:
              if login_marker not in api:
                  raise SystemExit('Expected login method was not found in api.ts; refusing a speculative edit.')
              api = api.replace(login_marker, logout_method, 1)
          write('src/services/api.ts', api)

          # ---------- frontend AuthContext logout ----------
          auth = read('src/context/AuthContext.tsx')
          old_logout = '''  const logout = () => {
    localStorage.removeItem('gfp_auth_token');
    setToken(null);
    setUser(null);
  };'''
          new_logout = '''  const logout = () => {
    // Revoke the server-side token before clearing the browser state.
    // The local cleanup still happens even if the network request fails.
    void api.logout().catch((err) => {
      console.warn('Server logout request failed; clearing local session anyway:', err);
    }).finally(() => {
      localStorage.removeItem('gfp_auth_token');
      setToken(null);
      setUser(null);
    });
  };'''
          if old_logout not in auth:
              raise SystemExit('Expected AuthContext logout implementation was not found; refusing a speculative edit.')
          auth = auth.replace(old_logout, new_logout, 1)
          write('src/context/AuthContext.tsx', auth)

          # ---------- package.json ----------
          package = json.loads(read('package.json'))
          package['scripts']['clean'] = 'rm -rf dist'
          write('package.json', json.dumps(package, indent=2) + '\n')
          PY

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit hardening changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/security-hardening-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "security: harden pharmacy authentication and order access"
          git push origin HEAD:security-hardening-2026-08-18
